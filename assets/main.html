<!DOCTYPE html>
<html lang='fr'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='css/main.css'>
</head>
<body>
    <section class='main'>
        <article>
            <h1>Bienvenue sur notre page</h1>
            <p>Ceci est un exemple de page HTML avec un champ de saisie et un affichage de résultat.</p>
        </article>
        <aside>
            <h2>Instructions</h2>
            <p>Veuillez entrer votre texte dans le champ ci-dessous et appuyez sur Entrée pour voir le résultat.</p>
        </aside>
    </section>
    <separator></separator>
    <section class='main'>
        <dl id='output'>
            <dt>Résultat :</dt>
            <dd id='result'>ff</dd>
        </dl>
        <dl>
            <dt>Entrée :</dt>
            <dd><input type='text' id='inputField' placeholder='Entrez votre texte ici'></dd>
        </dl>
    </section>
</body>
</html>
