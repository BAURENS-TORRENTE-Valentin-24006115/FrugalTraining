<!DOCTYPE html>
<html lang='fr'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>IA Frugal</title>
    <link rel='stylesheet' href='css/frugal.css'>
    <link rel='stylesheet' href='css/admin.css'>
</head>
<body>
    <main class='dashboard'>
        <section class='top-panel'>
            <aside class='score-panel'>
                <img id='persona-image' src='' alt='Image du persona' width='32' height='32'>
                <h1 id='role-header'>Role: ...</h1>
                <p class='score-summary'>Moyenne du score<br>des IA:<br><strong id='average-score-text'>--/100</strong></p>
                <h2>Tableaux des<br>scores</h2>
                <div class='chart' aria-label='Score comparatif des modèles'>
                    <div class='chart-scale'><span>100</span><span>80</span><span>60</span><span>40</span><span>20</span><span>0</span></div>
                    <div class='chart-grid' id='chart-grid'></div>
                    <div class='chart-labels' id='chart-labels'></div>
                </div>
            </aside>
            <article class='response-panel'>
                <div class="cycle-controls">
                    <button id="start-cycle" type="button">Lancer un cycle</button>
                    <button id="open-admin" type="button" onclick="afficherMotDePasse()">Administration</button>
                    <span id="cycle-status" role="status"></span>
                </div>
                <p id='ai-answer'></p>
            </article>
        </section>
        <section class='bottom-panel'>
            <aside class='score-panel' id='roles-list'>
                <!-- Dynamically generated roles -->
            </aside>
            <div class='compact'></div>
            <article class='model-list' id='models-list'>
                <!-- Dynamically generated models -->
            </article>
        </section>
    </main>
    <div id="admin-login">
    <div class="admin-box">
        <h2>Accès admin</h2>
        <input type="password" id="admin-password">
        <input type="password" id="admin-confirmation" placeholder="Confirmer le mot de passe" style="display:none">
        <p id="admin-message"></p>
        <button onclick="cacherMotDePasse()">Annuler</button>
        <button onclick="validerMotDePasse()">Valider</button>
    </div>
    </div>
    <script src="scripts/admin.js"></script>
    <script src="scripts/frugal_ai.js"></script>
</body>
</html>
